          <nav class="main-nav" aria-label="Primary navigation">
            <a href="#about">ABOUT</a><a href="#work">WORK</a><a href="#contact">CONTACT</a>
          </nav>
          <a class="icon-link codepen" href="https://codepen.io/wodniack" aria-label="Follow me on CodePen" target="_blank" rel="noreferrer">

          <aside class="availability"><p>Coding globally from France.</p><p>Available for freelance work → <a href="mailto:hello@wodniack.dev">Hire me</a></p></aside>
          <a class="mobile-hire" href="mailto:hello@wodniack.dev">Hire me</a>
        </header>

        <div class="line-field" id="top" role="img" aria-label="Animated wave field"><a-waves><svg class="js-svg" aria-hidden="true"></svg></a-waves></div>
        <div class="hero-content">
        <data-strip class="data-strip" data-segments="5" role="img" aria-label="Binary data strip"></data-strip>
          <h1 class="hero-title" id="hero-title" aria-label="JIKO SCHNEE"><span class="hero-word" aria-hidden="true"><span class="hero-letter-cell"><span class="hero-letter-sizer">J</span><span class="hero-letter-track"><span class="hero-letter">J</span><span class="hero-letter">J</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">I</span><span class="hero-letter-track"><span class="hero-letter">I</span><span class="hero-letter">I</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">K</span><span class="hero-letter-track"><span class="hero-letter">K</span><span class="hero-letter">K</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">O</span><span class="hero-letter-track"><span class="hero-letter">O</span><span class="hero-letter">O</span></span></span></span><img class="hero-star" src="./assets/wodniack/images/asset-star.svg" alt="" aria-hidden="true"><span class="hero-word" aria-hidden="true"><span class="hero-letter-cell"><span class="hero-letter-sizer">S</span><span class="hero-letter-track"><span class="hero-letter">S</span><span class="hero-letter">S</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">C</span><span class="hero-letter-track"><span class="hero-letter">C</span><span class="hero-letter">C</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">H</span><span class="hero-letter-track"><span class="hero-letter">H</span><span class="hero-letter">H</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">N</span><span class="hero-letter-track"><span class="hero-letter">N</span><span class="hero-letter">N</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">E</span><span class="hero-letter-track"><span class="hero-letter">E</span><span class="hero-letter">E</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">E</span><span class="hero-letter-track"><span class="hero-letter">E</span><span class="hero-letter">E</span></span></span></span></h1>
          <data-strip class="data-strip data-strip--bottom" data-segments="4" role="img" aria-label="Binary data strip"></data-strip>
        </div>
      </section>

      <section class="about" id="about">
        <svg class="about-connectors" aria-hidden="true" focusable="false"><path class="about-outer"></path><path class="about-grid"></path><path class="about-link about-link--tl"></path><path class="about-link about-link--tr"></path><path class="about-link about-link--bl"></path><path class="about-link about-link--br"></path></svg>
        <div class="about-content-block" aria-hidden="true"></div>
        <data-strip class="data-strip about-strip" data-segments="4" role="img" aria-label="Binary data strip"></data-strip>
      </section>

      <section class="work" id="work" aria-labelledby="work-title">
        <div class="work-stage">
          <div class="work-zoom-scene">
            <div class="work-grid" aria-hidden="true"></div>
            <svg class="work-aperture" aria-hidden="true" focusable="false" preserveAspectRatio="none">
            <defs>
              <pattern id="work-aperture-dots" width="12" height="12" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1"></circle>
              </pattern>
              <mask id="work-aperture-mask" maskUnits="userSpaceOnUse">
                <rect class="work-aperture-cover"></rect>
                <rect class="work-aperture-hole"></rect>
              </mask>
            </defs>
            <g mask="url(#work-aperture-mask)">
              <rect class="work-aperture-paper"></rect>
              <path class="work-aperture-lines"></path>
              <rect class="work-aperture-dot-field"></rect>
            </g>
            </svg>
            <div class="work-capsule work-capsule--outer">
              <div class="work-capsule work-capsule--inner">
                <div class="work-dot-field" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="work-type-layer">
            <div class="work-type-inner-mask">
              <h2 id="work-title" class="work-title"><span>W</span><span>O</span><span>R</span><span>K</span></h2>
              <div class="work-spread" aria-hidden="true"></div>
            </div>
          </div>
          <div class="work-media" id="work-media"></div>
        </div>
      </section>

      <data-strip class="data-strip work-strip" data-segments="5" role="img" aria-label="WORK binary data strip"></data-strip>

      <section class="my-way" aria-label="My way">
        <div class="my-way-lines" aria-hidden="true"></div>
        <div class="my-way-type my-way-type--perspective" data-my-way-type>
          <div class="text-plane">
            <div class="my-way-type-motion">
              <h2 class="my-way-type-copy">
                <span class="my-way-type-line my-way-type-line--coding">Coding</span>
                <span class="my-way-type-line my-way-type-line--my-way">My Way</span>
                <span class="my-way-type-line my-way-type-line--since">Since</span>
                <span class="my-way-type-line my-way-type-line--year">1987</span>
              </h2>
            </div>
          </div>
        </div>
        <span class="my-way-smiley-mask" aria-hidden="true"></span>
        <img class="my-way-smiley" src="./assets/wodniack/images/asset-smiley--main.svg" alt="" />
        <div class="my-way-stretch-control" role="group" aria-label="My Way text controls">
          <label for="my-way-stretch"><span>TYPE STRETCH</span><output id="my-way-stretch-value" for="my-way-stretch">260%</output></label>
          <input id="my-way-stretch" type="range" min="60" max="260" step="1" value="260" aria-label="Adjust My Way text vertical stretch" />
          <label for="my-way-line-gap"><span>LINE GAP</span><output id="my-way-line-gap-value" for="my-way-line-gap">60PX</output></label>
          <input id="my-way-line-gap" type="range" min="0" max="80" step="1" value="60" aria-label="Adjust My Way text line gap" />
          <label for="my-way-speed"><span>TYPE SPEED</span><output id="my-way-speed-value" for="my-way-speed">180%</output></label>
          <input id="my-way-speed" type="range" min="0" max="300" step="1" value="180" aria-label="Adjust My Way text overall speed" />
          <label for="my-way-start"><span>TYPE START</span><output id="my-way-start-value" for="my-way-start">160PX</output></label>
          <input id="my-way-start" type="range" min="-900" max="300" step="1" value="160" aria-label="Adjust My Way text start offset" />
        </div>
        <div class="memory-field" id="memory-field"></div>
      </section>

      <section class="contact" id="contact">
        <svg class="contact-grid" aria-hidden="true"><path></path></svg>
        <div class="contact-stage">
          <a class="contact-hit" href="mailto:hello@wodniack.dev" aria-label="Email hello@wodniack.dev">
            <span class="go" aria-hidden="true"><span class="go-label">GO</span></span>
            <span class="contact-portal" aria-hidden="true"></span>
            <span class="contact-portal-core" aria-hidden="true"><span class="contact-portal-stars"><svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg><svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg><svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg><svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg></span></span>
            <span class="contact-copy" aria-hidden="true"><span class="contact-copy-lines"><span class="contact-copy-row contact-copy-row--top"><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">L</span><span class="contact-copy-trail contact-copy-trail--2">L</span><span class="contact-copy-trail contact-copy-trail--3">L</span><span class="contact-copy-glyph">L</span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">e</span><span class="contact-copy-trail contact-copy-trail--2">e</span><span class="contact-copy-trail contact-copy-trail--3">e</span><span class="contact-copy-glyph">e</span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">t<span class="contact-copy-apostrophe">'</span></span><span class="contact-copy-trail contact-copy-trail--2">t<span class="contact-copy-apostrophe">'</span></span><span class="contact-copy-trail contact-copy-trail--3">t<span class="contact-copy-apostrophe">'</span></span><span class="contact-copy-glyph">t<span class="contact-copy-apostrophe">'</span></span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">s</span><span class="contact-copy-trail contact-copy-trail--2">s</span><span class="contact-copy-trail contact-copy-trail--3">s</span><span class="contact-copy-glyph">s</span></span></span><span class="contact-copy-row contact-copy-row--bottom"><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">R</span><span class="contact-copy-trail contact-copy-trail--2">R</span><span class="contact-copy-trail contact-copy-trail--3">R</span><span class="contact-copy-glyph">R</span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">o</span><span class="contact-copy-trail contact-copy-trail--2">o</span><span class="contact-copy-trail contact-copy-trail--3">o</span><span class="contact-copy-glyph">o</span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">c</span><span class="contact-copy-trail contact-copy-trail--2">c</span><span class="contact-copy-trail contact-copy-trail--3">c</span><span class="contact-copy-glyph">c</span></span><span class="contact-copy-character"><span class="contact-copy-trail contact-copy-trail--1">k</span><span class="contact-copy-trail contact-copy-trail--2">k</span><span class="contact-copy-trail contact-copy-trail--3">k</span><span class="contact-copy-glyph">k</span></span></span></span><span class="email">hello@wodniack.dev</span></span>
          </a>
          <div class="contact-size-control" role="group" aria-label="Portal controls">
            <label for="portal-size"><span>PORTAL SIZE</span><output id="portal-size-value" for="portal-size">48VW</output></label>
            <input id="portal-size" type="range" min="40" max="76" step="1" value="48" aria-label="Adjust portal hover size" />
            <label for="portal-exponent"><span>CURVE EXPONENT</span><output id="portal-exponent-value" for="portal-exponent">5.00</output></label>
            <input id="portal-exponent" type="range" min="100" max="500" step="5" value="500" aria-label="Adjust portal hover curve exponent" />
            <label for="portal-speed"><span>PORTAL SPEED</span><output id="portal-speed-value" for="portal-speed">1.35X</output></label>
            <input id="portal-speed" type="range" min="50" max="250" step="5" value="135" aria-label="Adjust portal expansion speed" />
            <label for="inner-ring-speed"><span>INNER RING SPEED</span><output id="inner-ring-speed-value" for="inner-ring-speed">0.95X</output></label>
            <input id="inner-ring-speed" type="range" min="35" max="100" step="5" value="95" aria-label="Adjust inner portal ring speed" />
            <label for="inner-ring-delay"><span>INNER RING DELAY</span><output id="inner-ring-delay-value" for="inner-ring-delay">40MS</output></label>
            <input id="inner-ring-delay" type="range" min="0" max="800" step="20" value="40" aria-label="Adjust inner portal ring start delay" />
            <label for="portal-delay"><span>PORTAL DELAY</span><output id="portal-delay-value" for="portal-delay">0MS</output></label>
            <input id="portal-delay" type="range" min="0" max="1200" step="20" value="0" aria-label="Adjust portal expansion delay" />
            <label for="go-hover-scale"><span>GO HOVER SCALE</span><output id="go-hover-scale-value" for="go-hover-scale">120%</output></label>
            <input id="go-hover-scale" type="range" min="100" max="150" step="1" value="120" aria-label="Adjust GO hover scale" />
            <label for="go-hover-time"><span>GO HOVER TIME</span><output id="go-hover-time-value" for="go-hover-time">380MS</output></label>
            <input id="go-hover-time" type="range" min="0" max="1600" step="20" value="380" aria-label="Adjust GO hover growth time" />
          </div>
          <div class="contact-wave-control" role="group" aria-label="Wave controls">
            <p class="contact-control-heading">IDLE RIPPLE</p>
            <label for="portal-ripple-thickness"><span>RIPPLE THICKNESS</span><output id="portal-ripple-thickness-value" for="portal-ripple-thickness">30%</output></label>
            <input id="portal-ripple-thickness" type="range" min="5" max="30" step="1" value="30" aria-label="Adjust idle ripple thickness" />
            <label for="portal-ripple-sigma"><span>RIPPLE SIGMA</span><output id="portal-ripple-sigma-value" for="portal-ripple-sigma">0.92</output></label>
            <input id="portal-ripple-sigma" type="range" min="10" max="100" step="1" value="92" aria-label="Adjust idle ripple standard deviation" />
            <label for="portal-ripple-speed"><span>RIPPLE SPEED</span><output id="portal-ripple-speed-value" for="portal-ripple-speed">1.50X</output></label>
            <input id="portal-ripple-speed" type="range" min="50" max="240" step="5" value="150" aria-label="Adjust idle ripple speed" />
            <label for="portal-go-grow-speed"><span>GO GROW SPEED</span><output id="portal-go-grow-speed-value" for="portal-go-grow-speed">1.65X</output></label>
            <input id="portal-go-grow-speed" type="range" min="30" max="240" step="5" value="165" aria-label="Adjust idle GO grow speed" />
            <label for="portal-go-shrink-speed"><span>GO SHRINK SPEED</span><output id="portal-go-shrink-speed-value" for="portal-go-shrink-speed">2.40X</output></label>
            <input id="portal-go-shrink-speed" type="range" min="50" max="400" step="5" value="240" aria-label="Adjust idle GO shrink speed" />
            <label for="portal-go-min-scale"><span>GO MIN SCALE</span><output id="portal-go-min-scale-value" for="portal-go-min-scale">81%</output></label>
            <input id="portal-go-min-scale" type="range" min="20" max="90" step="1" value="81" aria-label="Adjust idle GO minimum scale" />
            <p class="contact-control-heading">TEXT TRAIL</p>
            <label for="contact-copy-speed"><span>LETTER SPEED</span><output id="contact-copy-speed-value" for="contact-copy-speed">1.95X</output></label>
            <input id="contact-copy-speed" type="range" min="50" max="250" step="5" value="195" aria-label="Adjust contact letter motion speed" />
            <label for="contact-copy-stagger"><span>LETTER STAGGER</span><output id="contact-copy-stagger-value" for="contact-copy-stagger">80MS</output></label>
            <input id="contact-copy-stagger" type="range" min="0" max="800" step="20" value="80" aria-label="Adjust same-row letter delay" />
            <label for="contact-trail-delay"><span>TRAIL DELAY</span><output id="contact-trail-delay-value" for="contact-trail-delay">100MS</output></label>
            <input id="contact-trail-delay" type="range" min="0" max="600" step="20" value="100" aria-label="Adjust text trail delay" />
            <p class="contact-control-heading">TRIGGER WAVE</p>
            <label for="portal-wave-strength"><span>WAVE STRENGTH</span><output id="portal-wave-strength-value" for="portal-wave-strength">40%</output></label>
            <input id="portal-wave-strength" type="range" min="0" max="100" step="1" value="40" aria-label="Adjust triggered wave strength" />
            <label for="portal-wave-width"><span>WAVE WIDTH</span><output id="portal-wave-width-value" for="portal-wave-width">24%</output></label>
            <input id="portal-wave-width" type="range" min="5" max="40" step="1" value="24" aria-label="Adjust triggered wave width" />
            <label for="portal-wave-sigma"><span>WAVE SIGMA</span><output id="portal-wave-sigma-value" for="portal-wave-sigma">1.00</output></label>
            <input id="portal-wave-sigma" type="range" min="10" max="100" step="1" value="100" aria-label="Adjust triggered wave standard deviation" />
            <label for="portal-wave-speed"><span>WAVE SPEED</span><output id="portal-wave-speed-value" for="portal-wave-speed">2.00X</output></label>
            <input id="portal-wave-speed" type="range" min="50" max="240" step="5" value="200" aria-label="Adjust triggered wave propagation speed" />
            <label for="portal-wave-delay"><span>START TIME</span><output id="portal-wave-delay-value" for="portal-wave-delay">500MS</output></label>
            <input id="portal-wave-delay" type="range" min="0" max="1200" step="20" value="500" aria-label="Adjust triggered wave start delay" />
            <label for="portal-wave-range"><span>WAVE RANGE</span><output id="portal-wave-range-value" for="portal-wave-range">360%</output></label>
            <input id="portal-wave-range" type="range" min="100" max="420" step="1" value="360" aria-label="Adjust triggered wave range" />
          </div>
        </div>
      </section>
