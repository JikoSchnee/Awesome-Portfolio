<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e1cab8" />
    <title>AW - Creative Developer Freelance - France</title>
    <link rel="icon" href="./assets/wodniack/images/favicon.ico" />
    <link rel="preload" href="./assets/wodniack/fonts/Bigger-Display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <main class="site-shell">
      <section class="hero" aria-labelledby="hero-title">
        <header class="site-head">
          <a class="brand" href="#top" aria-label="Antoine Wodniack">
            <svg viewBox="0 0 280 280" aria-hidden="true">
              <path d="M240.245 0v263.2h-19.894V0h-39.756v263.2h-19.861V0h-39.755v280H280V0h-39.755Z" />
              <path d="M0 0v280h39.755V16.8H59.65V280h39.756V0H0Z" />
            </svg>
          </a>
          <div class="loader-copy" aria-live="polite"><span id="loader-line">PLEASE WAIT WHILE I OVERTHINK THIS</span></div>
          <div class="mobile-gap" aria-hidden="true"></div>
          <nav class="main-nav" aria-label="Primary navigation">
            <a href="#about">ABOUT</a><a href="#work">WORK</a><a href="#contact">CONTACT</a>
          </nav>
          <a class="icon-link codepen" href="https://codepen.io/wodniack" aria-label="Follow me on CodePen" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5.25v9.5L12 22l-9-5.25v-9.5L12 2Zm0 2.35L6.08 7.8 12 11.25l5.92-3.45L12 4.35ZM5 9.54v4.92l4.23-2.46L5 9.54Zm14 0L14.77 12 19 14.46V9.54ZM12 12.75 6.08 16.2 12 19.65l5.92-3.45L12 12.75Z" /></svg>
          </a>
          <a class="icon-link linkedin" href="https://www.linkedin.com/in/wodniack/" aria-label="Follow me on LinkedIn" target="_blank" rel="noreferrer">in</a>
          <button class="contrast" type="button" aria-label="Change background color"><span></span></button>
          <aside class="availability"><p>Coding globally from France.</p><p>Available for freelance work → <a href="mailto:hello@wodniack.dev">Hire me</a></p></aside>
          <a class="mobile-hire" href="mailto:hello@wodniack.dev">Hire me</a>
        </header>

        <div class="line-field" id="top" role="img" aria-label="Animated wave field"><a-waves><svg class="js-svg" aria-hidden="true"></svg></a-waves></div>
        <div class="hero-content">
        <data-strip class="data-strip" data-segments="5" role="img" aria-label="Binary data strip"></data-strip>
          <h1 class="hero-title" id="hero-title" aria-label="JIKO SCHNEE"><span class="hero-word" aria-hidden="true"><span class="hero-letter-cell"><span class="hero-letter-sizer">J</span><span class="hero-letter-track"><span class="hero-letter">J</span><span class="hero-letter">J</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">I</span><span class="hero-letter-track"><span class="hero-letter">I</span><span class="hero-letter">I</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">K</span><span class="hero-letter-track"><span class="hero-letter">K</span><span class="hero-letter">K</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">O</span><span class="hero-letter-track"><span class="hero-letter">O</span><span class="hero-letter">O</span></span></span></span><img class="hero-star" src="./assets/wodniack/images/asset-star.svg" alt="" aria-hidden="true"><span class="hero-word" aria-hidden="true"><span class="hero-letter-cell"><span class="hero-letter-sizer">S</span><span class="hero-letter-track"><span class="hero-letter">S</span><span class="hero-letter">S</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">C</span><span class="hero-letter-track"><span class="hero-letter">C</span><span class="hero-letter">C</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">H</span><span class="hero-letter-track"><span class="hero-letter">H</span><span class="hero-letter">H</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">N</span><span class="hero-letter-track"><span class="hero-letter">N</span><span class="hero-letter">N</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">E</span><span class="hero-letter-track"><span class="hero-letter">E</span><span class="hero-letter">E</span></span></span><span class="hero-letter-cell"><span class="hero-letter-sizer">E</span><span class="hero-letter-track"><span class="hero-letter">E</span><span class="hero-letter">E</span></span></span></span></h1>
          <data-strip class="data-strip data-strip--bottom" data-segments="4" role="img" aria-label="Binary data strip"></data-strip>
        </div>
      </section>

      <section class="about" id="about">
        <svg class="about-connectors" aria-hidden="true" focusable="false"><path class="about-outer"></path><path class="about-grid"></path><path class="about-link about-link--tl"></path><path class="about-link about-link--tr"></path><path class="about-link about-link--bl"></path><path class="about-link about-link--br"></path></svg>
        <div class="about-content-block" aria-hidden="true"></div>
        <data-strip class="data-strip about-strip" data-segments="4" role="img" aria-label="Binary data strip"></data-strip>
      </section>

      <section class="work" id="work" aria-labelledby="work-title">
        <div class="work-stage">
          <div class="work-zoom-scene">
            <div class="work-grid" aria-hidden="true"></div>
            <svg class="work-aperture" aria-hidden="true" focusable="false" preserveAspectRatio="none">
            <defs>
              <pattern id="work-aperture-dots" width="12" height="12" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1"></circle>
              </pattern>
              <mask id="work-aperture-mask" maskUnits="userSpaceOnUse">
                <rect class="work-aperture-cover"></rect>
                <rect class="work-aperture-hole"></rect>
              </mask>
            </defs>
            <g mask="url(#work-aperture-mask)">
              <rect class="work-aperture-paper"></rect>
              <path class="work-aperture-lines"></path>
              <rect class="work-aperture-dot-field"></rect>
            </g>
            </svg>
            <div class="work-capsule work-capsule--outer">
              <div class="work-capsule work-capsule--inner">
                <div class="work-dot-field" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="work-type-layer">
            <div class="work-type-inner-mask">
              <h2 id="work-title" class="work-title"><span>W</span><span>O</span><span>R</span><span>K</span></h2>
              <div class="work-spread" aria-hidden="true"></div>
            </div>
          </div>
          <div class="work-media" id="work-media"></div>
        </div>
      </section>

      <data-strip class="data-strip work-strip" data-segments="5" role="img" aria-label="WORK binary data strip"></data-strip>

      <section class="my-way" aria-label="My way">
        <div class="my-way-lines" aria-hidden="true"></div>
        <div class="my-way-type my-way-type--perspective" data-my-way-type>
          <div class="text-plane">
            <div class="my-way-type-motion">
              <h2 class="my-way-type-copy">
                <span class="my-way-type-line my-way-type-line--coding">Coding</span>
                <span class="my-way-type-line my-way-type-line--my-way">My Way</span>
                <span class="my-way-type-line my-way-type-line--since">Since</span>
                <span class="my-way-type-line my-way-type-line--year">1987</span>
              </h2>
            </div>
          </div>
        </div>
        <span class="my-way-smiley-mask" aria-hidden="true"></span>
        <img class="my-way-smiley" src="./assets/wodniack/images/asset-smiley--main.svg" alt="" />
        <div class="my-way-stretch-control" role="group" aria-label="My Way text controls">
          <label for="my-way-stretch"><span>TYPE STRETCH</span><output id="my-way-stretch-value" for="my-way-stretch">260%</output></label>
          <input id="my-way-stretch" type="range" min="60" max="260" step="1" value="260" aria-label="Adjust My Way text vertical stretch" />
          <label for="my-way-line-gap"><span>LINE GAP</span><output id="my-way-line-gap-value" for="my-way-line-gap">60PX</output></label>
          <input id="my-way-line-gap" type="range" min="0" max="80" step="1" value="60" aria-label="Adjust My Way text line gap" />
          <label for="my-way-speed"><span>TYPE SPEED</span><output id="my-way-speed-value" for="my-way-speed">180%</output></label>
          <input id="my-way-speed" type="range" min="0" max="300" step="1" value="180" aria-label="Adjust My Way text overall speed" />
          <label for="my-way-start"><span>TYPE START</span><output id="my-way-start-value" for="my-way-start">160PX</output></label>
          <input id="my-way-start" type="range" min="-900" max="300" step="1" value="160" aria-label="Adjust My Way text start offset" />
        </div>
        <div class="memory-field" id="memory-field"></div>
      </section>

      <section class="contact" id="contact">
        <svg class="contact-grid" aria-hidden="true"><path></path></svg>
        <div class="contact-stage">
          <a class="contact-hit" href="mailto:hello@wodniack.dev" aria-label="Email hello@wodniack.dev">
            <span class="go" aria-hidden="true">GO</span>
            <span class="contact-portal" aria-hidden="true"><span class="contact-portal-stars"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></span></span>
            <span class="contact-copy" aria-hidden="true"><span class="lets">Let<span>'</span>s</span><span class="rock">Rock</span><span class="email">hello@wodniack.dev</span></span>
          </a>
          <div class="contact-size-control" role="group" aria-label="Portal controls">
            <label for="portal-size"><span>PORTAL SIZE</span><output id="portal-size-value" for="portal-size">40VW</output></label>
            <input id="portal-size" type="range" min="40" max="76" step="1" value="40" aria-label="Adjust portal hover size" />
            <label for="portal-acceleration"><span>ACCELERATION</span><output id="portal-acceleration-value" for="portal-acceleration">3.00X</output></label>
            <input id="portal-acceleration" type="range" min="100" max="500" step="5" value="300" aria-label="Adjust portal expansion acceleration" />
            <label for="portal-speed"><span>PORTAL SPEED</span><output id="portal-speed-value" for="portal-speed">2.05X</output></label>
            <input id="portal-speed" type="range" min="50" max="250" step="5" value="205" aria-label="Adjust portal expansion speed" />
            <label for="portal-spring"><span>GRID SPRING</span><output id="portal-spring-value" for="portal-spring">50%</output></label>
            <input id="portal-spring" type="range" min="0" max="100" step="1" value="50" aria-label="Adjust grid spring overshoot" />
            <label for="portal-grid-range"><span>GRID RANGE</span><output id="portal-grid-range-value" for="portal-grid-range">360%</output></label>
            <input id="portal-grid-range" type="range" min="100" max="360" step="1" value="360" aria-label="Adjust grid deformation range" />
            <label for="portal-ripple-thickness"><span>RIPPLE THICKNESS</span><output id="portal-ripple-thickness-value" for="portal-ripple-thickness">30%</output></label>
            <input id="portal-ripple-thickness" type="range" min="5" max="30" step="1" value="30" aria-label="Adjust idle ripple thickness" />
            <label for="portal-ripple-sigma"><span>RIPPLE SIGMA</span><output id="portal-ripple-sigma-value" for="portal-ripple-sigma">0.92</output></label>
            <input id="portal-ripple-sigma" type="range" min="10" max="100" step="1" value="92" aria-label="Adjust idle ripple standard deviation" />
            <label for="portal-ripple-speed"><span>RIPPLE SPEED</span><output id="portal-ripple-speed-value" for="portal-ripple-speed">1.50X</output></label>
            <input id="portal-ripple-speed" type="range" min="50" max="240" step="5" value="150" aria-label="Adjust idle ripple speed" />
            <label for="portal-spring-time"><span>SPRING TIME</span><output id="portal-spring-time-value" for="portal-spring-time">560MS</output></label>
            <input id="portal-spring-time" type="range" min="360" max="620" step="10" value="560" aria-label="Adjust grid spring peak timing" />
            <label for="portal-rebound-time"><span>REBOUND TIME</span><output id="portal-rebound-time-value" for="portal-rebound-time">900MS</output></label>
            <input id="portal-rebound-time" type="range" min="80" max="900" step="10" value="900" aria-label="Adjust grid spring rebound duration" />
          </div>
        </div>
      </section>

      <footer class="site-foot">
        <a class="footer-brand" href="#top" aria-label="Antoine Wodniack"><svg viewBox="0 0 280 280" aria-hidden="true"><path d="M240.245 0v263.2h-19.894V0h-39.756v263.2h-19.861V0h-39.755v280H280V0h-39.755Z" /><path d="M0 0v280h39.755V16.8H59.65V280h39.756V0H0Z" /></svg></a>
      </footer>
    </main>
    <script src="./vendor/three.min.js"></script>
    <script src="./site.js"></script>
  </body>
</html>
